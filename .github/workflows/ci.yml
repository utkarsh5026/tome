name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one Pages deploy at a time, and never cancel one mid-flight — a
# cancelled deploy can leave the site on a half-published version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install step on purpose: if this ever needs one, the promise in the
      # README ("zero dependencies") has been broken.
      - run: python -m unittest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Lint only — see the note in pyproject.toml about hand formatting.
      - run: pipx run ruff check .

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The install path the README tells people to use has to actually work.
      - run: uv tool install .
      - run: tome --version
      - name: serve this repo and check it responds
        run: |
          tome --port 7979 &
          sleep 3
          curl -sf http://127.0.0.1:7979/ | grep -q "<title>"
          curl -sf http://127.0.0.1:7979/api/tree | grep -q '"groups"'

  # The site is README.md rendered by tome itself, so a broken renderer breaks
  # the build here rather than shipping a broken page.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 site/build.py
      - run: grep -q "Read any repo" site/_site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/_site

  # Publish only from main, and only once everything above is green.
  deploy:
    needs: [test, lint, install, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - id: deploy
        uses: actions/deploy-pages@v4
