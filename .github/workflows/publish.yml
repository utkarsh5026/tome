name: publish

# Fires on version tags (v0.1.0, v0.2.3, ...). Uses PyPI's trusted publishing
# (OIDC) — no API token stored in this repo. The trusted publisher has to be
# configured on the PyPI project side first: pypi.org -> tome-docs -> Publishing
# -> add GitHub publisher for utkarsh5026/tome, workflow "publish.yml",
# environment "pypi".
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tag is the source of truth for what's being published; catch a
      # forgotten version bump before it reaches PyPI instead of after.
      - name: tag matches __version__ in tome.py
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('tome.py').read()).group(1))")
          if [ "$tag_version" != "$file_version" ]; then
            echo "tag v$tag_version does not match __version__ = $file_version in tome.py" >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tome-docs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
